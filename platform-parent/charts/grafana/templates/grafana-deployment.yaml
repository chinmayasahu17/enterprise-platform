apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment

spec:
  replicas: {{ .Values.grafanareplicas }}

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana

          image: grafana/grafana:11.0.0

          ports:
            - containerPort: 3000
            
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana

          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.adminUser }}

            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.adminPassword }}

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc    
---
apiVersion: v1
kind: Service

metadata:
  name: grafana-service

spec:
  selector:
    app: grafana

  ports:
    - port: 3000
      targetPort: 3000

  type: NodePort

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 2Gi