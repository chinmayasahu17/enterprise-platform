apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |-
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: 'spring-boot-services'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: 
              - gateway:8081
              - ingestion-service:8081
              - processing-service:8081
              - notification-service:8081
              - report-service:8081
              - scheduler-service:8081